name: container

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "ha-app/**"
      - ".github/workflows/container.yml"
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "ha-app/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jakobfischer2574/proscenic-790t-local:0.1.0
            ghcr.io/jakobfischer2574/proscenic-790t-local:latest
          build-args: |
            BUILD_VERSION=0.1.0
            BUILD_ARCH=amd64
