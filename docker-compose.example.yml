services:
  proscenic-790t-local:
    build: .
    restart: unless-stopped
    environment:
      ROBOTBONA_APP_KEY: "REPLACE_WITH_APP_KEY"
      ROBOTBONA_DEVICE_ID: "REPLACE_WITH_DEVICE_ID"
      ROBOTBONA_LOCAL_TOKEN: "LOCAL790T00000000000000000000000"
      ROBOTBONA_HTTP_PORT: "18080"
      ROBOTBONA_TCP_PORT: "20008"
      ROBOTBONA_API_PORT: "8090"
    ports:
      - "18080:18080/tcp"
      - "20008:20008/tcp"
      - "8090:8090/tcp"
    volumes:
      - proscenic-data:/data

volumes:
  proscenic-data:
